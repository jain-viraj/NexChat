<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web Clone</title>
    <style>
        :root {
            --wa-teal: #008069;
            --wa-teal-light: #00a884;
            --wa-bg: #efeae2;
            --wa-panel-bg: #f0f2f5;
            --wa-white: #ffffff;
            --wa-text-primary: #111b21;
            --wa-text-secondary: #667781;
            --wa-border: #e9edef;
            --wa-message-out: #d9fdd3;
            --wa-message-in: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #d1d7db;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Screen */
        #login-screen {
            background: var(--wa-white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 17px 50px 0 rgba(11,20,26,.19), 0 12px 15px 0 rgba(11,20,26,.24);
            text-align: center;
            width: 400px;
            z-index: 10;
        }

        #login-screen h2 {
            color: var(--wa-teal);
            margin-bottom: 20px;
            font-weight: 300;
        }

        #login-screen input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--wa-border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #login-screen input:focus {
            border-color: var(--wa-teal);
        }

        #login-screen button {
            background-color: var(--wa-teal);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 24px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #login-screen button:hover {
            background-color: var(--wa-teal-light);
        }

        /* App Container */
        #app-container {
            display: none;
            width: 100%;
            max-width: 1600px;
            height: calc(100vh - 40px);
            background: var(--wa-white);
            box-shadow: 0 6px 18px rgba(11,20,26,.05);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Green Background Strip behind app */
        .bg-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 127px;
            background-color: var(--wa-teal);
            z-index: -1;
        }

        .sidebar {
            width: 30%;
            min-width: 300px;
            max-width: 50vw; /* Prevent pulling it too far */
            border-right: 1px solid var(--wa-border);
            display: flex;
            flex-direction: column;
            background: var(--wa-white);
            resize: horizontal;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .header {
            background: var(--wa-panel-bg);
            height: 60px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--wa-border);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #dfe5e7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--wa-white);
        }

        .header-title {
            margin-left: 15px;
            font-weight: 500;
            color: var(--wa-text-primary);
        }

        .search-container {
            padding: 8px 12px;
            background: var(--wa-white);
            border-bottom: 1px solid var(--wa-border);
            display: flex;
        }

        .search-input {
            width: 100%;
            background: var(--wa-panel-bg);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .contact-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            display: flex;
            padding: 0 15px;
            height: 72px;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .contact-item:hover {
            background-color: #f5f6f6;
        }

        .contact-item.active {
            background-color: var(--wa-panel-bg);
        }

        .contact-info {
            flex: 1;
            margin-left: 15px;
            border-bottom: 1px solid var(--wa-border);
            height: 100%;
            display: flex;
            align-items: center;
        }

        .contact-name {
            font-size: 17px;
            color: var(--wa-text-primary);
        }

        /* Chat Window */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--wa-bg);
            /* WhatsApp Doodle Background Pattern Mock */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.06"><circle cx="50" cy="50" r="2" fill="%23000"/></svg>');
        }

        .chat-header {
            background: var(--wa-panel-bg);
            height: 60px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--wa-border);
            visibility: hidden;
        }

        .chat-history {
            flex: 1;
            padding: 20px 60px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 65%;
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 7.5px;
            font-size: 14px;
            position: relative;
            line-height: 19px;
            box-shadow: 0 1px 0.5px rgba(11,20,26,.13);
        }

        .message-in {
            align-self: flex-start;
            background-color: var(--wa-message-in);
            border-top-left-radius: 0;
        }

        .message-out {
            align-self: flex-end;
            background-color: var(--wa-message-out);
            border-top-right-radius: 0;
        }
        
        .message-time {
            font-size: 11px;
            color: var(--wa-text-secondary);
            float: right;
            margin-top: 4px;
            margin-left: 10px;
        }

        .chat-input-area {
            background: var(--wa-panel-bg);
            min-height: 62px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            visibility: hidden;
        }

        .chat-input {
            flex: 1;
            border: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: var(--wa-white);
        }

        .send-btn {
            background: none;
            border: none;
            margin-left: 15px;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn svg {
            fill: var(--wa-text-secondary);
            width: 26px;
            height: 26px;
        }

        /* Default Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--wa-panel-bg);
            border-bottom: 6px solid var(--wa-teal-light);
        }
        .empty-state h1 {
            color: #41525d;
            font-weight: 300;
            margin-bottom: 15px;
        }
        .empty-state p {
            color: var(--wa-text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="bg-strip"></div>

<!-- Login Module -->
<div id="login-screen">
    <h2>WhatsApp Web Clone</h2>
    <input type="text" id="username" placeholder="Enter your username" autocomplete="off" onkeypress="handleLoginKey(event)"/>
    <input type="password" id="password" placeholder="Enter your password" onkeypress="handleLoginKey(event)"/>
    
    <div style="display: flex; gap: 10px;">
        <button onclick="login()">Login</button>
        <button onclick="register()" style="background-color: var(--wa-panel-bg); color: var(--wa-text-primary); border: 1px solid var(--wa-border);">Register</button>
    </div>
    <p id="login-error" style="color: red; margin-top: 15px; font-size: 14px; display: none;"></p>
</div>

<!-- Main App -->
<div id="app-container" style="display:none;">
    
    <!-- Sidebar / Contact List -->
    <div class="sidebar">
        <div class="header">
            <div class="avatar" id="my-avatar">?</div>
            <div class="header-title" id="my-username-display"></div>
            <button onclick="refreshContacts()" style="margin-left:auto; background:none; border:none; cursor:pointer;" title="Refresh Contacts">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="var(--wa-text-secondary)"><path d="M12 20.17c-4.5 0-8.17-3.67-8.17-8.17S7.5 3.83 12 3.83c2.08 0 4.04.8 5.53 2.14L15 8.5h6.5V2l-2.3 2.3C17.38 2.58 14.81 1.5 12 1.5 6.2 1.5 1.5 6.2 1.5 12S6.2 22.5 12 22.5c5.07 0 9.35-3.61 10.33-8.47h-2.38c-.9 3.53-4.14 6.14-8.05 6.14z"></path></svg>
            </button>
        </div>
        <div class="search-container">
            <input type="text" id="newChatInput" class="search-input" placeholder="Search or start new chat" onkeypress="handleNewChatKey(event)"/>
        </div>
        <div class="contact-list" id="contact-list">
            <!-- Contacts loaded dynamically -->
        </div>
    </div>

    <!-- Empty State (Shown before selecting a chat) -->
    <div class="empty-state" id="empty-state">
        <h1>WhatsApp Web Clone</h1>
        <p>Send and receive messages in real-time.</p>
        <p>Select a contact to start chatting.</p>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chat-area" style="display:none;">
        <div class="chat-header">
            <div class="avatar" id="chat-avatar" style="background-color: #00a884;">?</div>
            <div class="header-title" id="chat-partner-name">Contact Name</div>
        </div>
        
        <div class="chat-history" id="messages">
            <!-- Messages load here -->
        </div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" class="chat-input" placeholder="Type a message" onkeypress="handleChatKey(event)"/>
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"></path></svg>
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    let stompClient = null;
    let currentUser = null;
    let partnerUser = null;
    const colors = ['#00a884', '#1fa851', '#53bdeb', '#9466ff', '#e00049', '#ff8400'];

    function getAvatarColor(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        return colors[Math.abs(hash) % colors.length];
    }

    function formatTime(isoString) {
        if(!isoString) return new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        return new Date(isoString).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }

    function handleLoginKey(e) {
        if (e.key === 'Enter') login();
    }

    function handleChatKey(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function handleNewChatKey(e) {
        if (e.key === 'Enter') {
            const input = document.getElementById("newChatInput");
            const val = input.value.trim();
            if (val) {
                selectContact(val);
                input.value = "";
            }
        }
    }

    // Auth state map
    let jwtToken = null;

    function formatAuthHeaders() {
        return {
            'Authorization': 'Bearer ' + jwtToken,
            'Content-Type': 'application/json'
        };
    }

    function register() {
        const u = document.getElementById("username").value.trim();
        const p = document.getElementById("password").value.trim();
        const err = document.getElementById("login-error");
        
        if (!u || !p) { err.innerText = "Check inputs"; err.style.display = "block"; return; }

        fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        })
        .then(async res => {
            if (res.ok) {
                // If registered, auto login
                login();
            } else {
                err.innerText = await res.text();
                err.style.display = "block";
            }
        });
    }

    function login() {
        const u = document.getElementById("username").value.trim();
        const p = document.getElementById("password").value.trim();
        const err = document.getElementById("login-error");
        
        if (!u || !p) { err.innerText = "Check inputs"; err.style.display = "block"; return; }

        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        })
        .then(async res => {
            if (res.ok) {
                const data = await res.json();
                jwtToken = data.token;
                currentUser = data.username;
                
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("app-container").style.display = "flex";
                
                document.getElementById("my-username-display").innerText = currentUser;
                const myAv = document.getElementById("my-avatar");
                myAv.innerText = currentUser.charAt(0).toUpperCase();
                myAv.style.backgroundColor = getAvatarColor(currentUser);

                connectWebSocket();
                refreshContacts();
            } else {
                err.innerText = "Invalid credentials";
                err.style.display = "block";
            }
        });
    }

    function connectWebSocket() {
        if (!jwtToken) return;
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // Disable debug logging for clean console
        
        const headers = {
            'Authorization': 'Bearer ' + jwtToken
        };

        stompClient.connect(headers, function () {
            stompClient.subscribe('/queue/messages/' + encodeURIComponent(currentUser), function (msg) {
                const body = JSON.parse(msg.body);
                
                const bSender = body.sender.toLowerCase();
                const bReceiver = body.receiver.toLowerCase();
                const cUser = currentUser.toLowerCase();
                const pUser = partnerUser ? partnerUser.toLowerCase() : "";

                // If message is with current active partner, append it
                if (
                    (bSender === pUser && bReceiver === cUser) || 
                    (bSender === cUser && bReceiver === pUser)
                ) {
                    appendMessage(body);
                }
                // Refresh contacts to show new interactions
                if (bSender !== cUser && bSender !== pUser) {
                    refreshContacts();
                }
                
                // Force scroll to bottom on new message if we are already near it
                const msgDiv = document.getElementById("messages");
                if (msgDiv) msgDiv.scrollTop = msgDiv.scrollHeight;
            });
        });
    }

    function refreshContacts() {
        if (!jwtToken) return;
        fetch('/api/users', { headers: formatAuthHeaders() })
            .then(res => res.json())
            .then(users => {
                const list = document.getElementById("contact-list");
                list.innerHTML = "";
                
                users.forEach(u => {
                    if (u === currentUser) return; // Don't show self
                    
                    const div = document.createElement("div");
                    div.className = "contact-item" + (u === partnerUser ? " active" : "");
                    div.onclick = () => selectContact(u);
                    
                    const avatarColor = getAvatarColor(u);
                    const initial = u.charAt(0).toUpperCase();

                    div.innerHTML = `
                        <div class="avatar" style="background-color: ${avatarColor}">${initial}</div>
                        <div class="contact-info">
                            <span class="contact-name">${u}</span>
                        </div>
                    `;
                    list.appendChild(div);
                });
            });
    }

    function selectContact(contactUsername) {
        partnerUser = contactUsername;
        
        // Update UI states
        document.getElementById("empty-state").style.display = "none";
        document.getElementById("chat-area").style.display = "flex";
        
        const cHeader = document.querySelector(".chat-header");
        const cInput = document.querySelector(".chat-input-area");
        cHeader.style.visibility = "visible";
        cInput.style.visibility = "visible";

        document.getElementById("chat-partner-name").innerText = partnerUser;
        const av = document.getElementById("chat-avatar");
        av.innerText = partnerUser.charAt(0).toUpperCase();
        av.style.backgroundColor = getAvatarColor(partnerUser);
        
        // Highlight active sidebar item
        document.querySelectorAll(".contact-item").forEach(item => {
            item.classList.remove("active");
            if (item.querySelector(".contact-name").innerText === partnerUser) {
                item.classList.add("active");
            }
        });

        loadHistory();
        document.getElementById("messageInput").focus();
    }

    let currentPage = 0;
    let totalPages = 1;
    let isFetching = false;

    function appendMessage(msgDto, prepend = false) {
        const div = document.getElementById("messages");
        const msgDiv = document.createElement("div");
        
        const isMe = msgDto.sender.toLowerCase() === currentUser.toLowerCase();
        msgDiv.className = "message " + (isMe ? "message-out" : "message-in");
        
        const timeStr = formatTime(msgDto.timestamp);
        msgDiv.innerHTML = `${msgDto.content} <span class="message-time">${timeStr}</span>`;
        
        if (prepend) {
            div.prepend(msgDiv);
        } else {
            div.appendChild(msgDiv);
            div.scrollTop = div.scrollHeight;
        }
    }

    function loadHistory(page = 0) {
        if (isFetching) return;
        if (page > 0 && page >= totalPages) return;
        
        isFetching = true;

        const messagesDiv = document.getElementById("messages");
        const oldScrollHeight = messagesDiv.scrollHeight;

        if (page === 0) {
            messagesDiv.innerHTML = "";
            currentPage = 0;
            totalPages = 1; // Reset to allow subsequent fetches
        }

        fetch(`/api/history?user=${encodeURIComponent(currentUser)}&partner=${encodeURIComponent(partnerUser)}&page=${page}&size=20`, {
            headers: formatAuthHeaders()
        })
            .then(resp => resp.json())
            .then(data => {
                totalPages = data.totalPages;
                currentPage = data.currentPage;
                
                // If page > 0, we are prepending older messages at the top
                const isPrepending = page > 0;
                
                // When prepending, we iterate in reverse so chronological order is maintained
                const msgsToRender = isPrepending ? [...data.messages].reverse() : data.messages;
                
                msgsToRender.forEach(m => appendMessage(m, isPrepending));

                // If we prepended, keep the scroll position visually stable
                if (isPrepending) {
                    messagesDiv.scrollTop = messagesDiv.scrollHeight - oldScrollHeight;
                }
                isFetching = false;
            })
            .catch(() => isFetching = false);
    }

    // Infinite scroll listener
    document.getElementById("messages").addEventListener("scroll", function() {
        if (this.scrollTop === 0) {
            loadHistory(currentPage + 1);
        }
    });

    function sendMessage() {
        const input = document.getElementById("messageInput");
        const content = input.value.trim();
        if (!content || !stompClient || !partnerUser) return;
        
        const msg = {
            sender: currentUser,
            receiver: partnerUser,
            content: content
        };
        
        stompClient.send("/app/chat.send", {}, JSON.stringify(msg));
        input.value = "";
        input.focus();
    }
</script>
</body>
</html>
